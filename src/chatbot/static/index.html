function removeSession(id){fetch('/sessions/'+encodeURIComponent(id),{method:'DELETE'}).then(function(response){if(response.ok)showToast(t('toast.deleted'));else if(response.status!==404)showToast(t('toast.deleteFailed'),'error');}).catch(function(){showToast(t('toast.networkDelete'),'error');}).finally(function(){if(id===state.sessionId)startNewChat();loadSessions();});}
function startNewChat(){if(state.controller)state.controller.abort();state.sessionId=newSessionId();clearMessages();showEmpty();renderSidebar();closeSidebar();closePalette();try{history.replaceState(null,'',location.pathname);}catch(err){}
els.input.focus();}
function setSending(flag){state.sending=flag;var title=flag?t('send.stop'):t('send.send');els.send.textContent=flag?'■':'↑';els.send.title=title;els.send.setAttribute('aria-label',title);els.send.classList.toggle('stop',flag);}
function autoGrow(){els.input.style.height='auto';els.input.style.height=Math.min(els.input.scrollHeight,200)+'px';}
function updateCharCount(){if(!els.charCount)return;var length=els.input.value.length;els.charCount.textContent=length?String(length):'';}
function send(){if(state.sending){stopStreaming();return;}
var text=els.input.value.trim();if(!text){els.input.focus();return;}
els.input.value='';autoGrow();updateCharCount();setSending(true);var userBubble=addMessage('user');userBubble.textContent=text;var aiBubble=addMessage('assistant',formatNow());aiBubble.innerHTML='<span class="caret"></span>';var acc='';state.controller=new AbortController();fetch('/chat/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:state.sessionId,message:text}),signal:state.controller.signal}).then(function(res){if(!res.ok){return res.text().then(function(body){throw new Error('HTTP '+res.status+': '+body);});}
var reader=res.body.getReader();var decoder=new TextDecoder('utf-8');return(function pump(){return reader.read().then(function(chunk){if(chunk.done)return;acc+=decoder.decode(chunk.value,{stream:true});paint(aiBubble,acc,true);return pump();});})();}).catch(function(err){if(err.name==='AbortError'){paint(aiBubble,(acc||'')+'\n\n'+t('msg.stopped'),false);}else{aiBubble.classList.add('error');aiBubble.textContent=t('msg.requestError')+err.message;showToast(t('toast.requestFailed'),'error');}}).finally(function(){state.controller=null;setSending(false);if(acc)paint(aiBubble,acc,false);loadSessions();updateScrollButton();});}
function stopStreaming(){if(state.controller)state.controller.abort();}
if(els.send)els.send.addEventListener('click',send);if(els.input){els.input.addEventListener('keydown',function(ev){if(ev.key==='Enter'&&!ev.shiftKey&&!ev.isComposing){ev.preventDefault();send();}});els.input.addEventListener('input',function(){autoGrow();updateCharCount();});}
if(els.newChat){els.newChat.addEventListener('click',function(){if(state.controller)state.controller.abort();startNewChat();});}
if(els.clearChat){els.clearChat.addEventListener('click',function(){removeSession(state.sessionId);});}
if(els.menu){els.menu.addEventListener('click',function(){toggleSidebar(true);});}
if(els.overlay){els.overlay.addEventListener('click',closeSidebar);}
if(els.messages){els.messages.addEventListener('scroll',updateScrollButton);els.messages.addEventListener('click',function(ev){var target=ev.target;var btn=target&&target.closest?target.closest('.copy-code'):null;if(!btn)return;var block=btn.closest('.code-block');var code=block?block.querySelector('code'):null;if(!code)return;copyText(code.textContent).then(function(){btn.textContent=t('copied');setTimeout(function(){btn.textContent=t('copy');},1500);}).catch(function(){showToast(t('toast.copyFailed'),'error');});});}
if(els.scrollBottom){els.scrollBottom.addEventListener('click',function(){scrollToBottom('smooth');});}
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'){closeSidebar();closePalette();}});document.addEventListener('keydown',function(ev){var key=(ev.key||'').toUpperCase();if(ev.key==='F12'||(ev.ctrlKey&&ev.shiftKey&&(key==='I'||key==='J'||key==='C'))||(ev.ctrlKey&&key==='U')){ev.preventDefault();}});applyTheme();applyPalette();applyLanguage();showEmpty();renderSidebar();loadSessions();updateCharCount();els.input.focus();var initialSession=new URLSearchParams(location.search).get('session');if(initialSession)openSession(initialSession);})();</script></body></html>
