<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DeepSeek 对话助手</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #14181f;
    --panel-2: #1a1f28;
    --border: #232a34;
    --text: #e7e9ee;
    --muted: #8b94a3;
    --accent: #4d6bfe;
    --accent-soft: rgba(77, 107, 254, .16);
    --code-bg: #0b0e13;
    --danger: #ef5b6b;
  }
  [data-theme="light"] {
    --bg: #ffffff;
    --panel: #f7f8fa;
    --panel-2: #ffffff;
    --border: #e5e7eb;
    --text: #1f2329;
    --muted: #6b7280;
    --accent: #3b5bfd;
    --accent-soft: rgba(59, 91, 253, .10);
    --code-bg: #f2f4f7;
    --danger: #d92d20;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    grid-template-columns: 248px 1fr;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.7 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }

  /* ---------- 左侧会话栏 ---------- */
  .sidebar {
    display: flex; flex-direction: column; gap: 10px;
    padding: 14px; background: var(--panel);
    border-right: 1px solid var(--border); height: 100vh;
  }
  .new-chat {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--panel-2); color: var(--text); font-size: 14px;
  }
  .new-chat:hover { border-color: var(--accent); color: var(--accent); }
  .sidebar-title { font-size: 12px; color: var(--muted); padding: 4px 4px 0; }
  .session-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .session {
    display: flex; align-items: center; gap: 6px; padding: 8px 10px;
    border-radius: 9px; color: var(--muted); cursor: pointer; font-size: 13px;
  }
  .session:hover { background: var(--panel-2); color: var(--text); }
  .session.active { background: var(--accent-soft); color: var(--text); }
  .session-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-del { opacity: 0; width: 20px; height: 20px; border-radius: 6px; line-height: 1; font-size: 15px; }
  .session:hover .session-del { opacity: 1; }
  .session-del:hover { background: rgba(239, 91, 107, .15); color: var(--danger); }
  .sidebar-footer { font-size: 11px; color: var(--muted); padding-top: 8px; border-top: 1px solid var(--border); }

  /* ---------- 主区域 ---------- */
  .main { display: flex; flex-direction: column; height: 100vh; min-width: 0; }
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 20px; border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; }
  .tag { font-size: 11px; font-weight: 500; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; }
  .header-actions { display: flex; gap: 4px; }
  .ghost { padding: 6px 10px; border-radius: 8px; color: var(--muted); font-size: 13px; }
  .ghost:hover { background: var(--panel-2); color: var(--text); }

  .messages { flex: 1; overflow-y: auto; padding: 26px 20px 12px; }
  .messages > * { max-width: 760px; margin-left: auto; margin-right: auto; }
  .msg { display: flex; margin-bottom: 20px; }
  .msg.user { justify-content: flex-end; }
  .msg.user .bubble {
    background: var(--accent-soft); border: 1px solid rgba(77, 107, 254, .28);
    border-radius: 14px 14px 4px 14px; padding: 10px 14px;
    max-width: 78%; white-space: pre-wrap; word-break: break-word;
  }
  .msg.assistant .bubble { width: 100%; word-break: break-word; }
  .bubble.error { color: var(--danger); }

  /* ---------- Markdown 排版 ---------- */
  .bubble p { margin: 0 0 10px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble h1, .bubble h2, .bubble h3, .bubble h4 { margin: 16px 0 8px; font-size: 16px; line-height: 1.5; }
  .bubble ul, .bubble ol { margin: 8px 0; padding-left: 22px; }
  .bubble li { margin: 3px 0; }
  .bubble code {
    background: var(--code-bg); border: 1px solid var(--border); border-radius: 5px;
    padding: 1px 5px; font-family: ui-monospace, Consolas, "Courier New", monospace; font-size: 13px;
  }
  .bubble pre {
    background: var(--code-bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; overflow: auto; margin: 10px 0;
  }
  .bubble pre code { background: none; border: none; padding: 0; font-size: 13px; line-height: 1.6; }
  .bubble blockquote { margin: 10px 0; padding: 4px 12px; border-left: 3px solid var(--border); color: var(--muted); }
  .bubble a { color: var(--accent); }
  .bubble hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }

  /* ---------- 输入框 ---------- */
  .composer { display: flex; gap: 10px; align-items: flex-end; padding: 12px 20px 18px; border-top: 1px solid var(--border); }
  .composer textarea {
    flex: 1; resize: none; min-height: 46px; max-height: 180px; padding: 12px 14px;
    border-radius: 12px; border: 1px solid var(--border); background: var(--panel);
    color: var(--text); font: inherit; outline: none;
  }
  .composer textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .send { width: 44px; height: 44px; border-radius: 12px; background: var(--accent); color: #fff; font-size: 17px; display: grid; place-items: center; }
  .send:hover { filter: brightness(1.08); }
  .send.stop { background: var(--danger); }

  /* ---------- 光标与空状态 ---------- */
  .caret { display: inline-block; width: 7px; height: 1.05em; margin-left: 3px; background: var(--accent); vertical-align: -3px; border-radius: 1px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .empty { text-align: center; color: var(--muted); padding-top: 14vh; }
  .empty-title { font-size: 20px; font-weight: 600; color: var(--text); margin-bottom: 18px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip { border: 1px solid var(--border); background: var(--panel); color: var(--muted); padding: 7px 12px; border-radius: 999px; font-size: 13px; }
  .chip:hover { color: var(--accent); border-color: var(--accent); }

  @media (max-width: 820px) {
    body { grid-template-columns: 1fr; }
    .sidebar { display: none; }
  }
</style>
</head>
<body>
  <aside class="sidebar">
    <button id="new-chat" class="new-chat">＋ 新对话</button>
    <div class="sidebar-title">会话</div>
    <div id="session-list" class="session-list"></div>
    <div class="sidebar-footer">会话存在内存中，重启服务即清空</div>
  </aside>

  <main class="main">
    <header class="header">
      <div class="brand">DeepSeek 对话助手 <span class="tag">FastAPI</span></div>
      <div class="header-actions">
        <button id="clear-chat" class="ghost" title="清空当前会话">清空</button>
        <button id="theme-toggle" class="ghost" title="切换主题">☀️</button>
      </div>
    </header>

    <section id="messages" class="messages"></section>

    <footer class="composer">
      <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
      <button id="send" class="send" title="发送">↑</button>
    </footer>
  </main>

<script>
(function () {
  'use strict';

  var state = {
    sessionId: newSessionId(),
    sessions: [],
    sending: false,
    controller: null,
    theme: localStorage.getItem('chatbot-theme') || 'dark'
  };

  var els = {
    messages: document.getElementById('messages'),
    list: document.getElementById('session-list'),
    input: document.getElementById('input'),
    send: document.getElementById('send'),
    newChat: document.getElementById('new-chat'),
    clearChat: document.getElementById('clear-chat'),
    theme: document.getElementById('theme-toggle')
  };

  var CODE_TICK = '\u0060';                    // 反引号
  var CODE_SPAN = new RegExp(CODE_TICK + '([^' + CODE_TICK + ']+)' + CODE_TICK, 'g');
  var FENCE = CODE_TICK + CODE_TICK + CODE_TICK;

  function newSessionId() {
    return 'web-' + Math.random().toString(36).slice(2, 8);
  }

  /* ---------- 主题 ---------- */
  function applyTheme() {
    document.documentElement.setAttribute('data-theme', state.theme);
    els.theme.textContent = state.theme === 'dark' ? '☀️' : '🌙';
  }

  els.theme.addEventListener('click', function () {
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    localStorage.setItem('chatbot-theme', state.theme);
    applyTheme();
  });

  /* ---------- 迷你 Markdown 渲染 ---------- */
  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function inline(raw) {
    var codes = [];
    var s = escapeHtml(raw);
    s = s.replace(CODE_SPAN, function (m, p1) {
      codes.push(p1);
      return '\u0000' + (codes.length - 1) + '\u0000';
    });
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/\u0000(\d+)\u0000/g, function (m, i) {
      return '<code>' + codes[Number(i)] + '</code>';
    });
    return s;
  }

  function isBlockStart(line) {
    return /^(#{1,6})\s+/.test(line) ||
      /^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line) ||
      /^\s*>\s?/.test(line) ||
      /^\s*([-*+])\s+/.test(line) ||
      /^\s*\d+[.)]\s+/.test(line);
  }

  function renderBlocks(text) {
    var lines = text.split('\n');
    var html = [];
    var i = 0;
    while (i < lines.length) {
      var line = lines[i];
      if (!line.trim()) { i++; continue; }

      var h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) {
        var lv = Math.min(h[1].length, 4);
        html.push('<h' + lv + '>' + inline(h[2]) + '</h' + lv + '>');
        i++; continue;
      }
      if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { html.push('<hr>'); i++; continue; }

      if (/^\s*>\s?/.test(line)) {
        var quote = [];
        while (i < lines.length && /^\s*>\s?/.test(lines[i])) {
          quote.push(lines[i].replace(/^\s*>\s?/, ''));
          i++;
        }
        html.push('<blockquote>' + inline(quote.join('\n')).replace(/\n/g, '<br>') + '</blockquote>');
        continue;
      }

      if (/^\s*([-*+])\s+/.test(line)) {
        var items = [];
        while (i < lines.length && /^\s*([-*+])\s+/.test(lines[i])) {
          items.push('<li>' + inline(lines[i].replace(/^\s*[-*+]\s+/, '')) + '</li>');
          i++;
        }
        html.push('<ul>' + items.join('') + '</ul>');
        continue;
      }

      if (/^\s*\d+[.)]\s+/.test(line)) {
        var ordered = [];
        while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) {
          ordered.push('<li>' + inline(lines[i].replace(/^\s*\d+[.)]\s+/, '')) + '</li>');
          i++;
        }
        html.push('<ol>' + ordered.join('') + '</ol>');
        continue;
      }

      var para = [];
      while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i])) {
        para.push(lines[i]);
        i++;
      }
      html.push('<p>' + inline(para.join('\n')).replace(/\n/g, '<br>') + '</p>');
    }
    return html.join('');
  }

  function renderMarkdown(text) {
    var parts = text.split(FENCE);
    var out = [];
    for (var i = 0; i < parts.length; i++) {
      if (i % 2 === 1) {
        var block = parts[i];
        var nl = block.indexOf('\n');
        var lang = nl >= 0 ? block.slice(0, nl).trim() : '';
        var body = nl >= 0 ? block.slice(nl + 1) : block;
        out.push('<pre><code class="lang-' + escapeHtml(lang) + '">' + escapeHtml(body.replace(/\n$/, '')) + '</code></pre>');
      } else {
        out.push(renderBlocks(parts[i]));
      }
    }
    return out.join('');
  }

  /* ---------- 消息渲染 ---------- */
  function scrollToBottom() {
    els.messages.scrollTop = els.messages.scrollHeight;
  }

  function clearMessages() {
    els.messages.innerHTML = '';
  }

  function showEmpty() {
    var box = document.createElement('div');
    box.className = 'empty';
    var title = document.createElement('div');
    title.className = 'empty-title';
    title.textContent = '开始一段新对话';
    box.appendChild(title);

    var chips = document.createElement('div');
    chips.className = 'chips';
    ['解释单词 apple', '用 Python 写一个冒泡排序', '帮我把这句话改得更地道', '讲个笑话'].forEach(function (t) {
      var b = document.createElement('button');
      b.className = 'chip';
      b.textContent = t;
      b.addEventListener('click', function () {
        els.input.value = t;
        els.input.focus();
        autoGrow();
      });
      chips.appendChild(b);
    });
    box.appendChild(chips);
    els.messages.appendChild(box);
  }

  function addMessage(role) {
    var empty = els.messages.querySelector('.empty');
    if (empty) els.messages.removeChild(empty);
    var wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    wrap.appendChild(bubble);
    els.messages.appendChild(wrap);
    scrollToBottom();
    return bubble;
  }

  function paint(el, text, streaming) {
    el.innerHTML = renderMarkdown(text) + (streaming ? '<span class="caret"></span>' : '');
    scrollToBottom();
  }

  /* ---------- 会话 ---------- */
  function renderSidebar() {
    var ids = state.sessions.slice();
    if (ids.indexOf(state.sessionId) === -1) ids.unshift(state.sessionId);
    els.list.innerHTML = '';
    ids.forEach(function (id) {
      var row = document.createElement('div');
      row.className = 'session' + (id === state.sessionId ? ' active' : '');
      row.title = id;

      var name = document.createElement('span');
      name.className = 'session-name';
      name.textContent = id;

      var del = document.createElement('button');
      del.className = 'session-del';
      del.textContent = '×';
      del.title = '删除会话';
      del.addEventListener('click', function (ev) {
        ev.stopPropagation();
        removeSession(id);
      });

      row.appendChild(name);
      row.appendChild(del);
      row.addEventListener('click', function () {
        if (!state.sending) openSession(id);
      });
      els.list.appendChild(row);
    });
  }

  function loadSessions() {
    fetch('/sessions')
      .then(function (r) { return r.json(); })
      .then(function (data) { state.sessions = data.sessions || []; renderSidebar(); })
      .catch(function () { renderSidebar(); });
  }

  function openSession(id) {
    state.sessionId = id;
    renderSidebar();
    clearMessages();
    fetch('/sessions/' + encodeURIComponent(id) + '/messages')
      .then(function (r) { return r.status === 404 ? null : r.json(); })
      .then(function (data) {
        if (!data) { showEmpty(); return; }
        (data.messages || []).forEach(function (m) {
          var bubble = addMessage(m.role === 'user' ? 'user' : 'assistant');
          if (m.role === 'user') bubble.textContent = m.content;
          else bubble.innerHTML = renderMarkdown(m.content);
        });
        if (!(data.messages || []).length) showEmpty();
      })
      .catch(function () { showEmpty(); });
  }

  function removeSession(id) {
    fetch('/sessions/' + encodeURIComponent(id), { method: 'DELETE' })
      .catch(function () { })
      .finally(function () {
        if (id === state.sessionId) startNewChat();
        loadSessions();
      });
  }

  function startNewChat() {
    if (state.controller) state.controller.abort();
    state.sessionId = newSessionId();
    clearMessages();
    showEmpty();
    renderSidebar();
    els.input.focus();
  }

  /* ---------- 发送 ---------- */
  function setSending(flag) {
    state.sending = flag;
    els.send.textContent = flag ? '■' : '↑';
    els.send.title = flag ? '停止生成' : '发送';
    els.send.classList.toggle('stop', flag);
  }

  function autoGrow() {
    els.input.style.height = 'auto';
    els.input.style.height = Math.min(els.input.scrollHeight, 180) + 'px';
  }

  function send() {
    if (state.sending) { stopStreaming(); return; }
    var text = els.input.value.trim();
    if (!text) return;

    els.input.value = '';
    autoGrow();
    setSending(true);

    var userBubble = addMessage('user');
    userBubble.textContent = text;

    var aiBubble = addMessage('assistant');
    aiBubble.innerHTML = '<span class="caret"></span>';

    var acc = '';
    state.controller = new AbortController();

    fetch('/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: state.sessionId, message: text }),
      signal: state.controller.signal
    })
      .then(function (res) {
        if (!res.ok) {
          return res.text().then(function (body) {
            throw new Error('HTTP ' + res.status + '：' + body);
          });
        }
        var reader = res.body.getReader();
        var decoder = new TextDecoder('utf-8');
        return (function pump() {
          return reader.read().then(function (chunk) {
            if (chunk.done) return;
            acc += decoder.decode(chunk.value, { stream: true });
            paint(aiBubble, acc, true);
            return pump();
          });
        })();
      })
      .catch(function (err) {
        if (err.name === 'AbortError') {
          paint(aiBubble, (acc || '') + '\n\n*(已停止生成)*', false);
        } else {
          aiBubble.classList.add('error');
          aiBubble.textContent = '请求失败：' + err.message;
        }
      })
      .finally(function () {
        state.controller = null;
        setSending(false);
        if (acc) paint(aiBubble, acc, false);
        loadSessions();
      });
  }

  function stopStreaming() {
    if (state.controller) state.controller.abort();
  }

  /* ---------- 事件绑定 ---------- */
  els.send.addEventListener('click', send);

  els.input.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) {
      ev.preventDefault();
      send();
    }
  });

  els.input.addEventListener('input', autoGrow);

  els.newChat.addEventListener('click', function () {
    if (state.controller) state.controller.abort();
    startNewChat();
  });

  els.clearChat.addEventListener('click', function () {
    removeSession(state.sessionId);
  });

  /* ---------- 启动 ---------- */
  applyTheme();
  showEmpty();
  renderSidebar();
  loadSessions();
  els.input.focus();
})();
</script>
</body>
</html>
