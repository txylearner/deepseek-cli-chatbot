[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "deepseek-chatbot"
version = "0.3.0"
description = "A layered FastAPI chatbot with SQLite persistence, streaming output and a plain HTML frontend."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40.0,<2.0.0",
    "pydantic-settings>=2.4.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "rjsmin>=1.2.0",
]

[project.scripts]
chatbot = "chatbot.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chatbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"